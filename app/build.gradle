plugins {
    id 'com.android.application'
}

android {
    namespace 'com.videocraft.pro'
    compileSdk 36

    defaultConfig {
        applicationId "com.videocraft.pro"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation files('libs/ffmpeg-kit-full-gpl.aar')
    implementation files('libs/smart-exception-common.jar')
    implementation files('libs/smart-exception-java.jar')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
}
